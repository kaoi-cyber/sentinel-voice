# Publishes the static demo edition to GitHub Pages on every push to main.
# The full app (with server routes for live ElevenLabs and Tokenomist) runs locally: npm run dev.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm run check:engine
      - name: Build static edition (no server routes)
        run: |
          rm -rf src/app/api
          npx next build
        env:
          NEXT_PUBLIC_STATIC_DEMO: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
